name: Exact-source Windows ARM64 validation
'on':
  push:
    branches:
    - hermes-ci/windows-arm64-c075bae32cb2
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.12'
        - '3.13'
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        repository: finnagin/python-blosc
        ref: c075bae32cb27fefe454a732ea8f0b8b15018fa4
        persist-credentials: false
    - name: Verify exact public PR source SHA
      shell: pwsh
      env:
        EXPECTED_SOURCE_SHA: c075bae32cb27fefe454a732ea8f0b8b15018fa4
        SOURCE_REPOSITORY: finnagin/python-blosc
      run: '$actual = (git rev-parse HEAD).Trim()

        if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SOURCE_SHA) { throw "Unexpected source revision: $actual" }

        @{ source_sha=$actual; source_repository=$env:SOURCE_REPOSITORY; ci_sha=$env:GITHUB_SHA; runner_arch=$env:RUNNER_ARCH
        } | ConvertTo-Json | Set-Content provenance.json

        '
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        architecture: arm64
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: arm64
    - name: Install build requirements
      run: python -m pip install -r requirements.txt wheel ninja pefile
    - name: Build wheel from exact source
      id: build-wheel
      run: python -m pip wheel --no-deps --wheel-dir wheelhouse .
    - name: Verify native import closure and inventory hybrid CRT companion
      shell: python
      run: "\"\"\"Validate wheel integrity and native import closure, inventory hybrid CRTs.\"\"\"\nimport base64,csv,hashlib,io,json,pathlib,struct,subprocess,sys,sysconfig,zipfile\n\
        import pefile\n\ndef validate_inventory(items):\n    by_name={pathlib.PurePosixPath(n).name.lower():r for n,r in items.items()}\n\
        \    imported={n.lower() for r in items.values() for n in r['imports']+r['delay_imports']}\n    roots=[r for n,r in\
        \ items.items() if n.endswith('.pyd') or pathlib.PurePosixPath(n).name=='blosc.dll']\n    assert roots and all(r['machine']=='0xaa64'\
        \ for r in roots)\n    companions=[]\n    for name,r in by_name.items():\n        if r['machine']=='0xaa64':continue\n\
        \        # Do not misclassify the unused hybrid CRT companion as a native root.\n        assert name=='vcruntime140_1.dll',\
        \ (name,r)\n        assert r['machine']=='0x8664' and r['chpe_metadata_pointer'] and r['chpe_pointer_in_image'],r\n\
        \        assert name not in imported, ('non-native companion entered import closure',name)\n        companions.append(name)\n\
        \    return companions\n\ndef inspect(path):\n    with zipfile.ZipFile(path) as z:\n        record=[n for n in z.namelist()\
        \ if n.endswith('.dist-info/RECORD')];assert len(record)==1\n        count=0\n        for n,h,size in csv.reader(io.StringIO(z.read(record[0]).decode())):\n\
        \            if h:\n                alg,want=h.split('=',1);b=z.read(n)\n                assert base64.urlsafe_b64encode(hashlib.new(alg,b).digest()).rstrip(b'=').decode()==want,n\n\
        \                assert len(b)==int(size),n\n                count+=1\n        inventory={}\n        for n in z.namelist():\n\
        \            if not n.lower().endswith(('.pyd','.dll')):continue\n            p=pefile.PE(data=z.read(n));load=getattr(p,'DIRECTORY_ENTRY_LOAD_CONFIG',None)\n\
        \            chpe=getattr(load.struct,'CHPEMetadataPointer',0) if load else 0\n            inventory[n]={'machine':hex(p.FILE_HEADER.Machine),'imports':[x.dll.decode()\
        \ for x in getattr(p,'DIRECTORY_ENTRY_IMPORT',[])],'delay_imports':[x.dll.decode() for x in getattr(p,'DIRECTORY_ENTRY_DELAY_IMPORT',[])],'chpe_metadata_pointer':chpe,'chpe_pointer_in_image':p.OPTIONAL_HEADER.ImageBase<=chpe<p.OPTIONAL_HEADER.ImageBase+p.OPTIONAL_HEADER.SizeOfImage}\n\
        \        companions=validate_inventory(inventory)\n        return {'wheel':path.name,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'record_verified':count,'inventory':inventory,'non_imported_hybrid_crt_companions':companions,'native_runtime_roots_verified':True,'all_payload_machine_arm64':all(x['machine']=='0xaa64'\
        \ for x in inventory.values())}\n\ndef main():\n    assert sysconfig.get_platform()=='win-arm64',sysconfig.get_platform()\n\
        \    assert pefile.PE(sys.executable).FILE_HEADER.Machine==0xaa64\n    paths=list(pathlib.Path('wheelhouse').glob('*.whl'));assert\
        \ len(paths)==1\n    records=[inspect(p) for p in paths]\n    pathlib.Path('wheel-audit.json').write_text(json.dumps(records,indent=2))\n\
        \    print(json.dumps(records,indent=2))\n    out=pathlib.Path('pe-evidence');out.mkdir(exist_ok=True)\n    with zipfile.ZipFile(paths[0])\
        \ as z:\n        for n in z.namelist():\n            if not n.endswith(('.pyd','.dll')):continue\n            f=out/pathlib.PurePosixPath(n).name;f.write_bytes(z.read(n))\n\
        \            p=subprocess.run(['dumpbin','/headers','/loadconfig','/imports',str(f)],capture_output=True,text=True,check=True)\n\
        \            f.with_suffix(f.suffix+'.txt').write_text(p.stdout)\n            f.unlink()\n\nif __name__=='__main__':main()\n"
    - name: Fresh environment full upstream tests
      if: ${{ !cancelled() && steps.build-wheel.outcome == 'success' }}
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        python -m venv wheel-test

        if ($LASTEXITCODE -ne 0) { throw ''venv failed'' }

        $py = Join-Path $PWD ''wheel-test/Scripts/python.exe''

        $wheels = @(Get-ChildItem wheelhouse/*.whl)

        if ($wheels.Count -ne 1) { throw ''Expected one wheel'' }

        & $py -m pip install numpy psutil $wheels[0].FullName

        if ($LASTEXITCODE -ne 0) { throw ''wheel install failed'' }

        Push-Location $env:RUNNER_TEMP

        & $py -m blosc.test

        $code = $LASTEXITCODE

        Pop-Location

        if ($code -ne 0) { throw ''upstream tests failed'' }

        '
    - name: Upload blosc-${{ matrix.python-version }}-native-evidence
      uses: actions/upload-artifact@v4
      with:
        name: blosc-${{ matrix.python-version }}-native-evidence
        path: 'wheelhouse/*.whl

          provenance.json

          wheel-audit.json

          pe-evidence/*.txt'
        if-no-files-found: warn
        retention-days: 14
      if: ${{ always() }}
